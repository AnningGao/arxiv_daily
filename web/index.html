<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arXiv Daily Digest</title>
  <link rel="icon" href="data:," />

  <!-- KaTeX (math) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="menu-toggle" aria-label="Toggle menu">☰ Digests</button>

  <aside id="sidebar">
    <header class="sidebar-head">
      <h1>arXiv Digest</h1>
      <input id="search" type="search" placeholder="Search e.g. DESI, Lyman-alpha…"
             autocomplete="off" spellcheck="false" />
    </header>
    <nav id="menu" aria-label="Digest menu"></nav>
  </aside>

  <main id="content">
    <div id="article" class="article">Loading…</div>
  </main>

  <!-- marked (markdown) and KaTeX auto-render expose globals used by app.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- app.js is an ES module; it dynamically imports pdf.js. Module scripts are
       deferred, so the classic scripts above have already run by the time it executes. -->
  <script src="app.js" type="module"></script>
</body>
</html>
